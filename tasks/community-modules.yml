---
- name: Copy requirements.txt
  copy:
    src: "{{ odoo_role_community_modules_requirements_path }}"
    dest: "{{ odoo_role_odoo_modules_path }}/requirements.txt"
    owner: "{{ odoo_role_odoo_user }}"
    group: "{{ odoo_role_odoo_group }}"
    mode: 0644
  tags: ['community-modules', 'only-modules']

- name: Copy addons fingerprint script
  copy:
    src: addons_fingerprint.py
    dest: "{{ odoo_role_odoo_modules_path }}/addons_fingerprint.py"
    owner: "{{ odoo_role_odoo_user }}"
    group: "{{ odoo_role_odoo_group }}"
    mode: 0644
  tags: ['community-modules', 'only-modules']

- name: Fingerprint installed addons before installing packages
  command: "{{ odoo_role_odoo_python_path }} {{ odoo_role_odoo_modules_path }}/addons_fingerprint.py"
  register: reg_addons_before
  changed_when: false
  become: true
  become_user: "{{ odoo_role_odoo_user }}"
  tags: ['community-modules', 'only-modules']

- name: Read requirements.txt and filter packages without pinned versions from a package index
  shell: |
    grep -vE '==[0-9]' {{ odoo_role_odoo_modules_path }}/requirements.txt | grep -v 'git+' | grep -v '^#' | grep -v '^\s*$' || true
  register: upgradable_packages
  changed_when: false
  tags: ['community-modules', 'only-modules']

- name: Upgrade non-pinned packages to latest version using virtualenv
  pip:
    name: "{{ item }}"
    state: latest
    virtualenv: "{{ odoo_role_odoo_venv_path }}"
  become: true
  become_user: "{{ odoo_role_odoo_user }}"
  loop: "{{ upgradable_packages.stdout_lines }}"
  when: upgradable_packages.stdout_lines is defined and upgradable_packages.stdout_lines | length > 0
  tags: ['community-modules', 'only-modules']

# pip skips a git requirement (e.g. `pkg @ git+https://...@branch`) when the installed
# version number is the same, even if the branch has new commits. Force the reinstall
# so the code always matches the referenced branch. Dependencies are not reinstalled.
- name: Reinstall packages from git references using virtualenv
  shell: |
    set -o pipefail
    { grep 'git+' {{ odoo_role_odoo_modules_path }}/requirements.txt | grep -v '^\s*#' || true; } \
      | xargs -r -d '\n' {{ odoo_role_odoo_venv_path }}bin/pip install --force-reinstall --no-deps
  register: reg_pip_vcs
  changed_when: false
  become: true
  become_user: "{{ odoo_role_odoo_user }}"
  args:
    executable: /bin/bash
  tags: ['community-modules', 'only-modules']

- name: Install pinned packages (without upgrade, using virtualenv)
  shell: |
    source "{{ odoo_role_odoo_venv_path }}bin/activate" && grep -E '==[0-9]' {{ odoo_role_odoo_modules_path }}/requirements.txt | grep -v '^#' | grep -v '^\s*$' | xargs -r pip install
  register: reg_pip
  become: true
  become_user: "{{ odoo_role_odoo_user }}"
  args:
    executable: /bin/bash
  tags: ['community-modules', 'only-modules']

- name: Fingerprint installed addons after installing packages
  command: "{{ odoo_role_odoo_python_path }} {{ odoo_role_odoo_modules_path }}/addons_fingerprint.py"
  register: reg_addons_after
  changed_when: false
  become: true
  become_user: "{{ odoo_role_odoo_user }}"
  tags: ['community-modules', 'only-modules']

# Addons whose installed code changed. Newly installed addons are excluded:
# they are handled by the "Install only new Odoo modules" task.
- name: Detect upgraded addons
  set_fact:
    odoo_role_upgraded_modules: >-
      {%- set before = reg_addons_before.stdout | from_json -%}
      {%- set after = reg_addons_after.stdout | from_json -%}
      {%- set upgraded = [] -%}
      {%- for addon, fingerprint in after.items() | sort -%}
      {%-   if addon in before and before[addon] != fingerprint -%}
      {%-     set _ = upgraded.append(addon) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ upgraded }}
  tags: ['community-modules', 'only-modules']

- name: Show upgraded addons
  debug:
    var: odoo_role_upgraded_modules
  tags: ['community-modules', 'only-modules']
